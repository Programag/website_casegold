# Render Blueprint dla tego serwisu.
#
# Darmowe web service na Render NIE obsługują persistent disków, więc
# dane graczy trzymamy w Upstash Redis (darmowe konto na upstash.com,
# działa przez zwykłe REST API) zamiast na lokalnym dysku - patrz
# UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN poniżej. Bez tych
# dwóch zmiennych serwer po cichu wraca do pliku data/users.json obok
# kodu, co jest wygodne lokalnie, ale ginie przy każdym redeployu na
# Render.
#
# Jeśli usługa już istnieje i została utworzona ręcznie (nie przez ten
# Blueprint), samo wypchnięcie tego pliku niczego nie zmieni - trzeba
# jeszcze ręcznie dodać obie zmienne w Dashboard → usługa → Environment
# (albo zsynchronizować to repo jako Blueprint: Dashboard → New →
# Blueprint).
#
# Jak założyć darmowe Upstash Redis:
#   1. https://upstash.com → załóż konto → Create Database (Redis).
#   2. W zakładce "REST API" skopiuj UPSTASH_REDIS_REST_URL i
#      UPSTASH_REDIS_REST_TOKEN.
#   3. Wklej je jako zmienne środowiskowe w Render (patrz niżej albo
#      ręcznie w Dashboard → Environment).
services:
  - type: web
    name: casegold
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
