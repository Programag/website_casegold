<style>
  :root{
    --bg:#0b0d12;
    --panel:#141821;
    --panel-2:#1b202b;
    --line:#262c3a;
    --text:#e9ecf3;
    --muted:#7d879b;
    --hazard:#ff9500;
    --hazard-dim:#3a2712;
    --good:#3ddc84;
    --bad:#ff5a5a;
    --r-milspec:#4b69ff;
    --r-restricted:#8847ff;
    --r-classified:#d32ce6;
    --r-covert:#eb4b4b;
    --r-gold:#ffd700;
    --cyan:#22d3ee;
    --brown:#a5682f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #1a2030 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page-body{padding:24px 16px 60px;}

  .hazard-bar{
    height:8px;
    background:repeating-linear-gradient(135deg,var(--hazard) 0 14px,#111 14px 28px);
    opacity:.9;
  }

  .wrap{max-width:1100px;margin:0 auto;}

  /* ---------------- top navigation (shared across pages) ---------------- */
  .topnav{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px; border-bottom:1px solid var(--line);
    background:rgba(11,13,18,.8); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:18px;
  }
  .brand-icon{width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .brand-icon img{width:100%; height:100%; object-fit:contain; animation:logo-glow 2.4s ease-in-out infinite;}
  @keyframes logo-glow{
    0%,100%{filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 9px rgba(255,215,0,.55));}
    50%{filter:drop-shadow(0 0 7px #ffd700) drop-shadow(0 0 16px rgba(255,215,0,.85));}
  }
  .brand .accent{color:var(--hazard);}
  .brand-socials{display:flex; gap:8px; color:var(--muted); font-size:15px;}
  .brand-socials span, .brand-socials a{cursor:pointer; display:flex; align-items:center; justify-content:center; color:inherit; text-decoration:none;}
  .brand-socials span:hover, .brand-socials a:hover{color:var(--text);}
  .brand-socials svg{width:16px; height:16px; fill:currentColor; display:block;}
  .nav-links{
    display:flex; align-items:center; gap:14px; flex:1; flex-wrap:wrap;
  }
  .nav-link{
    text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.5px; font-family:'Oswald',sans-serif;
    padding-bottom:16px; margin-bottom:-15px; border-bottom:2px solid transparent;
    display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer;
    background:none; border-top:none; border-left:none; border-right:none;
  }
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--hazard); border-bottom-color:var(--hazard);}
  .beta-tag{
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    background:rgba(136,71,255,.14); color:var(--r-restricted);
    padding:2px 5px; border-radius:4px; letter-spacing:.5px;
  }
  .nav-right{display:flex; align-items:center; gap:8px;}
  .daily-btn{
    background:var(--panel-2); border:1px solid var(--hazard-dim); color:var(--text);
    padding:8px 11px; border-radius:9px; cursor:pointer; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; white-space:nowrap; font-family:'Inter',sans-serif;
  }
  .daily-btn:hover{border-color:var(--hazard); color:var(--hazard);}
  .daily-btn:disabled{opacity:.5; cursor:not-allowed;}
  .wallet-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line);
    padding:6px 6px 6px 12px; border-radius:9px;
  }
  .wallet-chip .wc-amount{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--good); font-size:14.5px; white-space:nowrap;}
  .wallet-chip .wc-add{
    width:26px; height:26px; border-radius:7px; border:none; cursor:pointer;
    background:var(--hazard); color:#181000; font-weight:800; font-size:15px; line-height:1;
  }
  .icon-btn{
    width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); cursor:pointer; font-size:16px; position:relative;
  }
  .icon-btn:hover{color:var(--hazard); border-color:var(--hazard);}
  .settings-wrap{position:relative;}
  .settings-menu{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:60;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    min-width:180px; box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
  }
  .settings-menu.open{display:block;}
  .settings-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:10px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .settings-menu button:hover{background:var(--panel-2); color:var(--hazard);}
  .avatar-wrap{position:relative; display:flex;}
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .lvl-badge{
    position:absolute; bottom:-4px; right:-4px; background:var(--r-gold); color:#3a2a00;
    font-size:9px; font-weight:800; padding:1px 5px; border-radius:8px; border:2px solid var(--bg);
    font-family:'JetBrains Mono',monospace;
  }
  @media (max-width:760px){
    .topnav .nav-links{flex:1 1 100%; flex-wrap:nowrap; gap:3px; justify-content:space-between;}
    .topnav .nav-link{gap:0; padding:0 0 10px; margin-bottom:0; font-size:10px; letter-spacing:0; white-space:nowrap;}
  }
  @media (max-width:400px){
    .topnav .nav-link{font-size:8.5px;}
  }

  /* ---------------- page content ---------------- */
  .hero-title{text-align:center; margin-bottom:30px;}
  .hero-icon{
    width:52px; height:52px; margin:0 auto 14px; border-radius:12px;
    background:var(--hazard-dim); border:1px solid var(--hazard);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .hero-title h1{
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:2px;
    font-size:clamp(28px,4.5vw,38px); margin:0 0 8px;
  }
  .hero-title .sub{color:var(--muted); font-size:13.5px;}

  .free-section{margin-bottom:36px;}
  .free-section-head{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1.5px; font-size:15px; font-weight:600;
  }
  .cooldown-tag{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:var(--hazard);
    background:var(--hazard-dim); border:1px solid var(--hazard); padding:3px 8px; border-radius:20px;
    text-transform:none; letter-spacing:.5px;
  }
  .free-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:18px;
  }
  .free-card{
    position:relative;
    background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--card-accent, var(--hazard));
    border-radius:12px; padding:0 0 16px; text-align:center; cursor:pointer;
    transition:transform .1s ease, border-color .15s ease;
  }
  .free-card:hover{transform:translateY(-2px);}
  .free-card.locked{cursor:not-allowed; opacity:.55;}
  .free-card.locked:hover{transform:none;}
  .free-card.free-card--glow{animation:free-card-glow 2.2s ease-in-out infinite;}
  @keyframes free-card-glow{
    0%,100%{box-shadow:0 0 10px -2px var(--card-accent, var(--hazard)), 0 0 22px -8px var(--card-accent, var(--hazard));}
    50%{box-shadow:0 0 22px 2px var(--card-accent, var(--hazard)), 0 0 42px 4px var(--card-accent, var(--hazard));}
  }
  .free-card .fc-tag{
    position:absolute; top:10px; right:10px; z-index:2;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700;
    padding:3px 8px; border-radius:20px; letter-spacing:.5px;
    background:var(--card-accent, var(--hazard)); color:#181000;
  }
  .free-card .fc-img{
    height:130px; margin-bottom:14px; border-radius:12px 12px 0 0;
    background:linear-gradient(160deg, var(--card-accent, var(--hazard)) 0%, var(--panel-2) 120%);
    display:flex; align-items:center; justify-content:center; font-size:44px;
    position:relative; overflow:hidden;
  }
  .free-card.locked .fc-img{filter:grayscale(1) brightness(.6);}
  .free-card .fc-img-photo{max-width:78%; max-height:78%; object-fit:contain;}
  .free-card .fc-lock{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:30px;
    background:rgba(6,8,13,.4);
  }
  .free-card.locked .fc-lock{display:flex;}
  .free-card .fc-name{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.5px; font-weight:600; font-size:15px; padding:0 12px;}
  .free-card .fc-status{
    margin-top:8px; font-size:12.5px; font-weight:700; color:var(--good);
    display:flex; align-items:center; justify-content:center; gap:5px; padding:0 10px;
  }
  .free-card .fc-status.cooldown{color:var(--muted); font-family:'JetBrains Mono',monospace; font-weight:500;}
  .free-card .fc-status.locked-msg{color:var(--muted); font-weight:400; font-size:11.5px; line-height:1.4;}

  footer{
    text-align:center; color:var(--muted); font-size:11px; margin-top:34px;
    letter-spacing:.5px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:12px 20px; border-radius:10px; font-size:13.5px; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .free-grid{grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px;}
    .free-card .fc-img{height:100px; font-size:34px;}
    .free-card .fc-name{font-size:12.5px;}
    .free-card .fc-status{font-size:11px;}
  }
</style>
</head>

<script>
const STORAGE_KEY = "cs2sim_state_v1";
const DAILY_BONUS_KEY = "cs2sim_daily_bonus_at";
const DAILY_BONUS_COOLDOWN_MS = 24 * 60 * 60 * 1000;
const START_BALANCE = 50.00;

function fmt(n){
  return n.toLocaleString("pl-PL", {minimumFractionDigits:2, maximumFractionDigits:2}) + " zł";
}
function loadState(){
  if(!(window.__STEAM_AUTH__ && window.__STEAM_AUTH__.loggedIn)) return {balance: 0, inventory: [], invCounter: 0, level: 0, xp: 0};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {balance: START_BALANCE, inventory: [], invCounter: 0, level: 0, xp: 0};
    const parsed = JSON.parse(raw);
    return {
      balance: typeof parsed.balance === "number" ? parsed.balance : START_BALANCE,
      inventory: Array.isArray(parsed.inventory) ? parsed.inventory : [],
      invCounter: typeof parsed.invCounter === "number" ? parsed.invCounter : 0,
      level: typeof parsed.level === "number" ? parsed.level : 0,
      xp: typeof parsed.xp === "number" ? parsed.xp : 0
    };
  }catch(e){
    return {balance: START_BALANCE, inventory: [], invCounter: 0, level: 0, xp: 0};
  }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({...state, ...window.SteamAuth.readPersistentExtras()})); window.SteamAuth.schedulePush(); }catch(e){}
}
let state = loadState();
/* Nowe konto (i każdy świeżo zalogowany przez Steam profil) startuje na
   poziomie 0 — poziom jest teraz częścią zapisywanego stanu (w chmurze
   dla kont Steam), nie na sztywno wpisaną liczbą.
   Liczone przez effectiveLevel(xp), NIE czytane wprost z state.level -
   ten drugi to osobne, zapisywane pole, które aktualizuje się tylko przy
   akcjach na innych stronach (np. otwarciu skrzynki) i potrafi zostać w
   tyle za faktycznym (chronionym) poziomem, blokując tu odblokowane już
   skrzynki za poziomy mimo poprawnego EXP. */
let PLAYER_LEVEL = window.SteamAuth.effectiveLevel(state.xp);
function renderBalance(){
  document.getElementById("balance").textContent = fmt(state.balance);
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

/* ---- nav / settings wiring shared with the rest of the site ---- */
document.querySelectorAll("[data-soon]").forEach(el => {
  el.addEventListener("click", () => showToast("Wkrótce dostępne!"));
});
const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settingsMenu");
settingsBtn.onclick = (e) => { e.stopPropagation(); settingsMenu.classList.toggle("open"); };
document.addEventListener("click", () => settingsMenu.classList.remove("open"));
document.getElementById("inventoryBtn").onclick = () => { window.location.href = "/equipment.html"; };

function fmtCountdown(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = String(Math.floor(total / 3600)).padStart(2,"0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2,"0");
  const s = String(total % 60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}
function renderDailyBonusBtn(){
  const btn = document.getElementById("dailyBonusBtn");
  if(!(window.__STEAM_AUTH__ && window.__STEAM_AUTH__.loggedIn)){ btn.disabled = false; btn.textContent = "🎁 Daily Bonus"; return; }
  const left = DAILY_BONUS_COOLDOWN_MS - (Date.now() - Number(localStorage.getItem(DAILY_BONUS_KEY) || 0));
  if(left > 0){ btn.disabled = true; btn.textContent = `🎁 ${fmtCountdown(left)}`; }
  else { btn.disabled = false; btn.textContent = "🎁 Daily Bonus"; }
}
document.getElementById("dailyBonusBtn").onclick = () => {
  if(!window.SteamAuth.requireLogin()) return;
  const now = Date.now();
  if(now - Number(localStorage.getItem(DAILY_BONUS_KEY) || 0) < DAILY_BONUS_COOLDOWN_MS) return;
  window.SteamAuth.openDailyBonusModal((reward) => {
    state.balance += reward;
    renderBalance();
    saveState(state);
    renderDailyBonusBtn();
    showToast(`Daily Bonus: +${fmt(reward)}!`);
  });
};
setInterval(renderDailyBonusBtn, 1000);

/* ---------------- free / level-gated case cards ---------------- */
const FREE_CASES = [
  {id:"free", key:"cs2sim_darmowe_free_at", name:"Free Case", tag:"DARMOWA", icon:"📦", img:"free_case_one.PNG", accent:"var(--hazard)", glow:true, cooldownMs:3*60*60*1000}
];
const LEVEL_CASES = [
  {id:"lvl10", key:"cs2sim_darmowe_lvl10_at", name:"Skrzynka Nowicjusza", tag:"LVL 10", icon:"📦", img:"free_case_two.PNG", accent:"var(--r-restricted)", glow:true, level:10, cooldownMs:3*60*60*1000},
  {id:"lvl20", key:"cs2sim_darmowe_lvl20_at", name:"Skrzynka Odkrywcy", tag:"LVL 20", icon:"📦", img:"free_case_three.PNG", accent:"var(--good)", glow:true, level:20, cooldownMs:3*60*60*1000},
  {id:"lvl30", key:"cs2sim_darmowe_lvl30_at", name:"Skrzynka Weterana", tag:"LVL 30", icon:"📦", img:"free_case_four.PNG", accent:"var(--r-covert)", glow:true, level:30, cooldownMs:3*60*60*1000},
  {id:"lvl40", key:"cs2sim_darmowe_lvl40_at", name:"Skrzynka Mistrza", tag:"LVL 40", icon:"📦", img:"free_case_five.PNG", accent:"var(--brown)", glow:true, level:40, cooldownMs:3*60*60*1000},
  {id:"lvl50", key:"cs2sim_darmowe_lvl50_at", name:"Skrzynka Legendy", tag:"LVL 50", icon:"📦", img:"free_case_six.PNG", accent:"var(--cyan)", glow:true, level:50, cooldownMs:3*60*60*1000}
];

/* Cards are built once — only the status line's text is mutated every
   tick, so click handlers never get torn down mid-click. */
function cardNode(c, locked){
  const card = document.createElement("div");
  card.className = "free-card" + (locked ? " locked" : "") + (c.glow ? " free-card--glow" : "");
  card.style.setProperty("--card-accent", c.accent);

  card.innerHTML = `
    <span class="fc-tag">${c.tag}</span>
    <div class="fc-img">${c.img ? `<img class="fc-img-photo" src="${c.img}" alt="${c.name}" onerror="this.outerHTML='${c.icon}';">` : c.icon}<div class="fc-lock">🔒</div></div>
    <div class="fc-name">${c.name}</div>
    <div class="fc-status"></div>
  `;
  if(!locked){
    card.onclick = () => { window.location.href = `/darmowe_open.html#${c.id}`; };
  }
  return card;
}

function updateCardStatus(card, c, locked){
  const statusEl = card.querySelector(".fc-status");
  const loggedIn = !!(window.__STEAM_AUTH__ && window.__STEAM_AUTH__.loggedIn);
  const left = loggedIn ? (c.cooldownMs - (Date.now() - Number(localStorage.getItem(c.key) || 0))) : 0;
  if(locked){
    statusEl.className = "fc-status locked-msg";
    statusEl.textContent = `Zdobądź poziom ${c.level}, aby odblokować tę skrzynkę.`;
  } else if(left > 0){
    statusEl.className = "fc-status cooldown";
    statusEl.textContent = `⏳ Za ${fmtCountdown(left)}`;
  } else {
    statusEl.className = "fc-status";
    statusEl.textContent = "🎁 Dostępna!";
  }
}

const topFreeGrid = document.getElementById("topFreeGrid");
const levelFreeGrid = document.getElementById("levelFreeGrid");
let cardEntries = [];
function buildCards(){
  topFreeGrid.innerHTML = "";
  levelFreeGrid.innerHTML = "";
  cardEntries = [];
  FREE_CASES.forEach(c => {
    const node = cardNode(c, false);
    topFreeGrid.appendChild(node);
    cardEntries.push([node, c, false]);
  });
  LEVEL_CASES.forEach(c => {
    const locked = PLAYER_LEVEL < c.level;
    const node = cardNode(c, locked);
    levelFreeGrid.appendChild(node);
    cardEntries.push([node, c, locked]);
  });
  renderCards();
}
function renderCards(){
  cardEntries.forEach(([node, c, locked]) => updateCardStatus(node, c, locked));
}
setInterval(renderCards, 1000);

renderBalance();
renderDailyBonusBtn();
buildCards();
</script>
