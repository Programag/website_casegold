name: Wyślij aktualizację na hosting (FTP)

on:
  push:
    branches: [steam-login]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Wyślij pliki przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Katalog strony na serwerze home.pl - obok niego w FTP-root są
          # też api/, backup/, logs/, svn_repo/, więc pliki muszą trafiać
          # właśnie tu, nie do katalogu głównego.
          server-dir: public_html/
          # images/ jednak NIE jest tu wykluczone - ostatecznie wgrane wprost
          # do repo (przez web-upload GitHuba), nie osobno przez FTP jak
          # pierwotnie planowane, więc powinno iść tą samą, zwykłą ścieżką
          # deployu co reszta plików.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            node-version-backup/**
            data/**
            server.js
            battle-lobby.js
            package.json
            package-lock.json
            render.yaml
            .env.example
            .github/**
