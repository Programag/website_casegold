name: Wyślij aktualizację na hosting (FTP)

on:
  push:
    branches: [steam-login]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Wyślij pliki przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # Katalog na serwerze, do którego mają trafić pliki strony (tam,
          # gdzie dziś wgrywasz przez FileZillę/panel). Jeśli po pierwszym
          # uruchomieniu pliki lądują w złym miejscu, zmień na katalog
          # strony, np. "public_html/" - musi kończyć się ukośnikiem.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            node-version-backup/**
            data/**
            server.js
            battle-lobby.js
            package.json
            package-lock.json
            render.yaml
            .env.example
            .github/**
