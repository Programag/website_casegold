<html lang="pl">
<head>

<script src="steam-auth.js?v=7"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASEGOLD // Topka</title>
<link rel="icon" type="image/png" href="casegold_logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d12;
    --panel:#141821;
    --panel-2:#1b202b;
    --line:#262c3a;
    --text:#e9ecf3;
    --muted:#7d879b;
    --hazard:#ff9500;
    --hazard-dim:#3a2712;
    --good:#3ddc84;
    --bad:#ff5a5a;
    --r-gold:#ffd700;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #1a2030 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page-body{padding:24px 16px 60px;}
  .hazard-bar{
    height:8px;
    background:repeating-linear-gradient(135deg,var(--hazard) 0 14px,#111 14px 28px);
    opacity:.9;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---------------- top navigation (shared across pages) ---------------- */
  .topnav{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px; border-bottom:1px solid var(--line);
    background:rgba(11,13,18,.8); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:18px;
  }
  .brand-icon{width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .brand-icon img{width:100%; height:100%; object-fit:contain; animation:logo-glow 2.4s ease-in-out infinite;}
  @keyframes logo-glow{
    0%,100%{filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 9px rgba(255,215,0,.55));}
    50%{filter:drop-shadow(0 0 7px #ffd700) drop-shadow(0 0 16px rgba(255,215,0,.85));}
  }
  .brand .accent{color:var(--hazard);}
  .brand-socials{display:flex; gap:8px; color:var(--muted); font-size:15px;}
  .brand-socials span, .brand-socials a{cursor:pointer; display:flex; align-items:center; justify-content:center; color:inherit; text-decoration:none;}
  .brand-socials span:hover, .brand-socials a:hover{color:var(--text);}
  .brand-socials svg{width:16px; height:16px; fill:currentColor; display:block;}
  .nav-links{
    display:flex; align-items:center; gap:14px; flex:1; flex-wrap:wrap;
  }
  .nav-link{
    text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.5px; font-family:'Oswald',sans-serif;
    padding-bottom:16px; margin-bottom:-15px; border-bottom:2px solid transparent;
    display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer;
    background:none; border-top:none; border-left:none; border-right:none;
  }
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--hazard); border-bottom-color:var(--hazard);}
  .nav-right{display:flex; align-items:center; gap:8px;}
  .daily-btn{
    background:var(--panel-2); border:1px solid var(--hazard-dim); color:var(--text);
    padding:8px 11px; border-radius:9px; cursor:pointer; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; white-space:nowrap; font-family:'Inter',sans-serif;
  }
  .daily-btn:hover{border-color:var(--hazard); color:var(--hazard);}
  .daily-btn:disabled{opacity:.5; cursor:not-allowed;}
  .wallet-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line);
    padding:6px 6px 6px 12px; border-radius:9px;
  }
  .wallet-chip .wc-amount{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--good); font-size:14.5px; white-space:nowrap;}
  .icon-btn{
    width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); cursor:pointer; font-size:16px; position:relative;
  }
  .icon-btn:hover{color:var(--hazard); border-color:var(--hazard);}
  .settings-wrap{position:relative;}
  .settings-menu{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:60;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    min-width:180px; box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
  }
  .settings-menu.open{display:block;}
  .settings-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:10px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .settings-menu button:hover{background:var(--panel-2); color:var(--hazard);}
  .avatar-wrap{position:relative; display:flex;}
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .lvl-badge{
    position:absolute; bottom:-4px; right:-4px; background:var(--r-gold); color:#3a2a00;
    font-size:9px; font-weight:800; padding:1px 5px; border-radius:8px; border:2px solid var(--bg);
    font-family:'JetBrains Mono',monospace;
  }
  @media (max-width:760px){
    .topnav .nav-links{flex:1 1 100%; flex-wrap:nowrap; gap:3px; justify-content:space-between;}
    .topnav .nav-link{gap:0; padding:0 0 10px; margin-bottom:0; font-size:10px; letter-spacing:0; white-space:nowrap;}
  }
  @media (max-width:400px){
    .topnav .nav-link{font-size:8.5px;}
  }
  .page-title{margin-bottom:26px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:clamp(28px,4vw,42px);margin:0;line-height:1;}
  h1 span{color:var(--hazard);}
  .sub{color:var(--muted);font-size:13px;letter-spacing:.5px;margin-top:6px;}

  /* ---------------- leaderboard ---------------- */
  .lb-panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .lb-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .lb-tab{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:9px 8px; border-radius:8px; cursor:pointer; font-size:11.5px; font-weight:600;
    font-family:'Inter',sans-serif; white-space:nowrap;
  }
  @media (max-width:600px){
    .lb-tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
    .lb-tab{padding:9px 4px; font-size:10.5px;}
  }
  @media (max-width:340px){
    .lb-tabs{grid-template-columns:1fr;}
  }
  .lb-tab:hover{color:var(--text); border-color:var(--hazard);}
  .lb-tab.active{color:var(--hazard); border-color:var(--hazard); background:var(--hazard-dim);}
  .lb-note{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:12px; color:var(--muted); margin-bottom:14px; display:none;
  }
  .lb-note.show{display:block;}
  .lb-note strong{color:var(--hazard);}
  .lb-row.rewarded .lb-rank{color:var(--good);}
  .lb-list{display:flex; flex-direction:column; gap:6px;}
  .lb-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    text-decoration:none;
  }
  .lb-row.empty{opacity:.35;}
  .lb-rank{width:22px; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--muted); flex:none;}
  .lb-row.rank-1 .lb-rank{color:var(--r-gold);}
  .lb-row.rank-2 .lb-rank{color:#c8ccd6;}
  .lb-row.rank-3 .lb-rank{color:#cd8a4d;}
  .lb-avatar{width:28px; height:28px; border-radius:50%; background:var(--panel); border:1px solid var(--line); object-fit:cover; flex:none;}
  .lb-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:600; color:var(--text); text-decoration:none;}
  a.lb-name:hover{color:var(--hazard);}
  .lb-value{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--good); flex:none;}
  .lb-loading, .lb-error{color:var(--muted); font-size:12.5px; text-align:center; padding:20px;}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;letter-spacing:.5px;}
</style>
</head>

<script>
const STORAGE_KEY = "cs2sim_state_v1";
const DAILY_BONUS_KEY = "cs2sim_daily_bonus_at";
const DAILY_BONUS_COOLDOWN_MS = 24 * 60 * 60 * 1000;
function fmt(n){
  return n.toLocaleString("pl-PL", {minimumFractionDigits:2, maximumFractionDigits:2}) + " zł";
}
function renderBalance(){
  const el = document.getElementById("balance");
  let bal = 0;
  if(window.__STEAM_AUTH__ && window.__STEAM_AUTH__.loggedIn){
    bal = 50;
    try{ const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); if(typeof s.balance === "number") bal = s.balance; }catch(e){}
  }
  el.textContent = fmt(bal);
}
renderBalance();

/* ---- shared top-nav widgets: settings dropdown + daily bonus (24h cooldown) ---- */
document.querySelectorAll("[data-soon]").forEach(el => {
  el.addEventListener("click", () => {});
});
const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settingsMenu");
settingsBtn.onclick = (e) => { e.stopPropagation(); settingsMenu.classList.toggle("open"); };
document.addEventListener("click", () => settingsMenu.classList.remove("open"));
document.getElementById("inventoryBtn").onclick = () => { window.location.href = "/equipment.html"; };
function fmtCountdown(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = String(Math.floor(total / 3600)).padStart(2,"0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2,"0");
  const s = String(total % 60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}
function renderDailyBonusBtn(){
  const btn = document.getElementById("dailyBonusBtn");
  if(!(window.__STEAM_AUTH__ && window.__STEAM_AUTH__.loggedIn)){ btn.disabled = false; btn.textContent = "🎁 Daily Bonus"; return; }
  const left = DAILY_BONUS_COOLDOWN_MS - (Date.now() - Number(localStorage.getItem(DAILY_BONUS_KEY) || 0));
  if(left > 0){ btn.disabled = true; btn.textContent = `🎁 ${fmtCountdown(left)}`; }
  else { btn.disabled = false; btn.textContent = "🎁 Daily Bonus"; }
}
document.getElementById("dailyBonusBtn").onclick = () => {
  if(!window.SteamAuth.requireLogin()) return;
  const now = Date.now();
  if(now - Number(localStorage.getItem(DAILY_BONUS_KEY) || 0) < DAILY_BONUS_COOLDOWN_MS) return;
  window.SteamAuth.openDailyBonusModal(() => {
    renderBalance();
    renderDailyBonusBtn();
  });
};
setInterval(renderDailyBonusBtn, 1000);
renderDailyBonusBtn();

/* ---------------- leaderboard ("Topka") ---------------- */
const LB_MAX_ROWS = 20;
const LB_TABS = {
  balance: { key: "balance", fmtValue: (v) => fmt(v) },
  upgrades: { key: "upgrades", fmtValue: (v) => String(v) },
  cases: { key: "cases", fmtValue: (v) => String(v) },
  niefart: { key: "niefart", fmtValue: (v) => `${v} przegr.` },
  active: { key: "active", fmtValue: (v) => `${v} bitew` },
};
// Ile górnych miejsc danej zakładki faktycznie dostaje nagrodę (podświetlane
// w topce jako wyróżnione) - patrz check_niefart_payout()/
// check_active_player_payout() po stronie serwera.
const LB_REWARDED_TOP = { niefart: 10, active: 1 };
const LB_REWARD_NOTES = {
  niefart: 'Najwięcej przegranych bitew Case Battle <strong>dzisiaj</strong>. Tuż po północy górna <strong>10</strong> z tych <strong>20</strong> miejsc dostaje automatycznie <strong>5000 zł</strong> do salda za dzień, który się właśnie skończył.',
  active: 'Najwięcej rozegranych bitew Case Battle <strong>dzisiaj</strong> (niezależnie od wyniku). Tuż po północy <strong>tylko pierwsze</strong> miejsce z tych <strong>20</strong> dostaje automatycznie <strong>2000 zł</strong> do salda za dzień, który się właśnie skończył.',
};
const LB_REWARD_TITLES = {
  niefart: "Dostanie 5000 zł po północy za dzisiejsze przegrane bitwy",
  active: "Dostanie 2000 zł po północy za dzisiejszą liczbę rozegranych bitew",
};
const lbRewardNote = document.getElementById("lbRewardNote");
const leaderboardList = document.getElementById("leaderboardList");
let leaderboardData = null;
let leaderboardTab = "balance";

document.querySelectorAll(".lb-tab").forEach(tab => {
  tab.onclick = () => {
    leaderboardTab = tab.dataset.lbTab;
    document.querySelectorAll(".lb-tab").forEach(t => t.classList.toggle("active", t === tab));
    const note = LB_REWARD_NOTES[leaderboardTab];
    lbRewardNote.innerHTML = note || "";
    lbRewardNote.classList.toggle("show", !!note);
    renderLeaderboard();
  };
});

async function loadLeaderboard(){
  leaderboardList.innerHTML = `<div class="lb-loading">Ładowanie…</div>`;
  try{
    const res = await fetch("/api/leaderboard.php");
    leaderboardData = await res.json();
    renderLeaderboard();
  }catch(e){
    leaderboardList.innerHTML = `<div class="lb-error">Nie udało się wczytać topki.</div>`;
  }
}

function renderLeaderboard(){
  if(!leaderboardData) return;
  const rows = leaderboardData[leaderboardTab] || [];
  const cfg = LB_TABS[leaderboardTab];
  leaderboardList.innerHTML = "";
  for(let i = 0; i < LB_MAX_ROWS; i++){
    const entry = rows[i];
    const rewardedTop = LB_REWARDED_TOP[leaderboardTab] || 0;
    const row = document.createElement(entry ? "a" : "div");
    row.className = "lb-row" + (entry ? "" : " empty") + (i < 3 && entry ? ` rank-${i+1}` : "") + (entry && i < rewardedTop ? " rewarded" : "");
    if(entry && i < rewardedTop){
      row.title = LB_REWARD_TITLES[leaderboardTab] || "";
    }
    if(entry){
      row.href = `/profile.html?u=${encodeURIComponent(entry.slug || "")}`;
    }
    const rank = document.createElement("div");
    rank.className = "lb-rank";
    rank.textContent = `#${i+1}`;
    row.appendChild(rank);

    const avatarSrc = entry ? entry.avatar : "";
    if(avatarSrc){
      const avatar = document.createElement("img");
      avatar.className = "lb-avatar";
      avatar.src = avatarSrc;
      avatar.alt = "";
      avatar.onerror = () => { avatar.replaceWith(Object.assign(document.createElement("div"), {className: "lb-avatar"})); };
      row.appendChild(avatar);
    } else {
      row.appendChild(Object.assign(document.createElement("div"), {className: "lb-avatar"}));
    }

    const name = document.createElement("div");
    name.className = "lb-name";
    name.textContent = entry ? (entry.displayName || "Gracz") : "—";
    row.appendChild(name);

    const value = document.createElement("div");
    value.className = "lb-value";
    value.textContent = entry ? cfg.fmtValue(entry.value) : "—";
    row.appendChild(value);

    leaderboardList.appendChild(row);
  }
}
loadLeaderboard();
</script>
</body>
</html>
